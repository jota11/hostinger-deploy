name: 'Deploy to Hostinger - SSH'
description: 'Deploy your website to Hostinger using GitHub Actions.'
author: Pedro de Mattos Mariano Mendes Neto
branding:
  icon: 'upload-cloud'
  color: 'purple'
inputs:
  ssh-private-key:
    description: 'SSH private key for authentication'
    required: true
  ssh-host:
    description: 'Remote server hostname or IP address'
    required: true
  ssh-user:
    description: 'SSH username'
    required: true
  ssh-port:
    description: 'SSH port'
    required: false
    default: '22'
  remote-path:
    description: 'Destination path on the remote server'
    required: true
  local-path:
    description: 'Local path of the artifact to upload'
    required: true
  rsync-options:
    description: 'rsync flags passed to the upload command'
    required: false
    default: '-avz --delete'
  post-deploy-commands:
    description: 'Shell commands to run on the server via SSH after the upload (optional)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Add server to known_hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -p "${{ inputs.ssh-port }}" -H "${{ inputs.ssh-host }}" >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Deploy via rsync
      shell: bash
      run: |
        rsync ${{ inputs.rsync-options }} \
          -e "ssh -p ${{ inputs.ssh-port }} -o StrictHostKeyChecking=yes" \
          "${{ inputs.local-path }}" \
          "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}:${{ inputs.remote-path }}"

    - name: Run post-deploy commands
      if: ${{ inputs.post-deploy-commands != '' }}
      shell: bash
      run: |
        ssh -p "${{ inputs.ssh-port }}" -o StrictHostKeyChecking=yes \
          "${{ inputs.ssh-user }}@${{ inputs.ssh-host }}" \
          bash -c '${{ inputs.post-deploy-commands }}'
